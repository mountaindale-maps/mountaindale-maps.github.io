<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mountaindale network map</title>
<meta name="description" content="Public as-built network map for Mountaindale on the October 31 aerial. Cable lengths are approximate, measured along the drawn route, in feet.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#detail">Skip to equipment details</a>
<div class="app">
  <header class="top">
    <div class="brand">
      <a class="home" href="../">Mountaindale</a>
      <h1>Network map</h1>
    </div>
    <form id="search-form" class="search" role="search">
      <label class="sr" for="q">Search equipment</label>
      <input id="q" name="q" type="search" placeholder="Search id, model, role, or group" autocomplete="off" enterkeyhint="search">
      <div id="results" class="results" hidden></div>
    </form>
    <div class="tools">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="fit">Fit</button>
      <button type="button" id="show-network" aria-expanded="false" aria-controls="topology">Show whole network</button>
      <button type="button" id="legend-btn" aria-expanded="false" aria-controls="legend">Legend</button>
    </div>
  </header>
  <aside id="detail" class="panel" aria-live="polite">
    <p class="muted">Loading the as-built network…</p>
  </aside>
  <div id="map" class="map" aria-label="Aerial map with network equipment">
    <div id="legend" class="legend" hidden>
      <div class="legend-head">
        <h2>Legend</h2>
        <button type="button" id="legend-close">Close</button>
      </div>
      <ul id="legend-items"></ul>
      <p>Numbered circles are groups of equipment. Tap a circle to spread them.</p>
      <p>Cable lengths are approximate, measured along the drawn route, in feet.</p>
    </div>
  </div>
  <section id="topology" class="topology" aria-label="Whole network" hidden>
    <header class="topo-head">
      <h2>Whole network</h2>
      <button type="button" id="topo-collapse" aria-expanded="true">Hide</button>
    </header>
    <ul id="link-key" class="link-key" aria-label="How links are drawn"></ul>
    <div id="topo-body"></div>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
